name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, test, build, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: virasat
          POSTGRES_PASSWORD: virasat_ci
          POSTGRES_DB: virasat
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U virasat -d virasat"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      CI: true
      DATABASE_URL: postgresql://virasat:virasat_ci@localhost:5432/virasat
      # Lets the production build serve /dev/components so the accessibility tests can run.
      # Never set this on the live server.
      ENABLE_DEV_PAGES: "true"
      # CI never talks to Stripe: these only let webhook tests create and check signatures.
      STRIPE_SECRET_KEY: sk_test_ci_not_a_real_key
      STRIPE_WEBHOOK_SECRET: whsec_ci_test_only
      # Emails are written to .outbox/ instead of being sent.
      EMAIL_OUTBOX: "true"
      CRON_SECRET: ci-cron-secret
      # Test-only value for login cookies and authenticator secrets in CI.
      BETTER_AUTH_SECRET: ci-only-better-auth-secret-0123456789abcdef

    steps:
      - uses: actions/checkout@v5

      # pnpm must exist before setup-node, because setup-node caches the pnpm store.
      # The version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Format check
        run: pnpm format:check

      - name: Unit tests
        run: pnpm test

      - name: Apply database migrations
        run: pnpm db:deploy

      - name: Seed sample catalogue
        run: pnpm db:seed

      - name: Integration tests
        run: pnpm test:integration

      - name: Build
        run: pnpm build

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
